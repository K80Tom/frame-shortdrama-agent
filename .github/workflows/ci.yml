name: Lyra CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths:
      - "packages/**"
      - "package*.json"
      - "docs/**"
      - "*.md"
      - ".github/**"
  push:
    branches: [main, dev]
    paths:
      - "packages/**"
      - "package*.json"
      - "docs/**"
      - "*.md"
      - ".github/**"

concurrency:
  group: lyra-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  branch-guard:
    name: Branch Guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify target branch policy
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "Push event: branch target validation is not required."
            exit 0
          fi
          echo "PR Base branch: $BASE_REF"
          echo "PR Head branch: $HEAD_REF"
          if [ "$BASE_REF" = "main" ] && [ "$HEAD_REF" != "dev" ]; then
            echo "::error title=Target Branch Invalid::普通功能与修复 PR 的目标分支必须为 'dev'。只有发版 PR（dev -> main）才允许以 'main' 为目标分支。请在 PR 顶部点击 Edit 将 base branch 修改为 'dev'。"
            exit 1
          fi
          echo "分支合规检查通过。"

  backend:
    name: Backend tests
    needs: [branch-guard]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: |
            packages/shared/package-lock.json
            packages/agent/package-lock.json
            packages/main/package-lock.json
      - name: Install backend dependencies
        run: npm --prefix packages/shared ci && npm --prefix packages/agent ci && npm --prefix packages/main ci
      - name: Build shared and agent
        run: npm --prefix packages/shared run build && npm --prefix packages/agent run build
      - name: Run backend tests
        run: npm --prefix packages/main test

  database:
    name: Database e2e
    needs: [branch-guard]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:17-alpine
        env:
          POSTGRES_USER: shortdrama
          POSTGRES_PASSWORD: shortdrama123
          POSTGRES_DB: shortdrama_agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shortdrama -d shortdrama_agent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://shortdrama:shortdrama123@127.0.0.1:5432/shortdrama_agent
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: |
            packages/shared/package-lock.json
            packages/agent/package-lock.json
            packages/main/package-lock.json
      - name: Install backend dependencies
        run: npm --prefix packages/shared ci && npm --prefix packages/agent ci && npm --prefix packages/main ci
      - name: Build shared and agent
        run: npm --prefix packages/shared run build && npm --prefix packages/agent run build
      - name: Apply database migrations
        run: npm --prefix packages/main run db:migrate
      - name: Run database integration and offline production matrix
        run: npm --prefix packages/main run test:db

  frontend:
    name: Frontend tests and build
    needs: [branch-guard]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: |
            packages/shared/package-lock.json
            packages/web/package-lock.json
      - name: Install frontend dependencies
        run: npm --prefix packages/shared ci && npm --prefix packages/web ci
      - name: Build shared contract
        run: npm --prefix packages/shared run build
      - name: Run frontend tests
        run: npm --prefix packages/web test
      - name: Build frontend
        run: npm --prefix packages/web run build
