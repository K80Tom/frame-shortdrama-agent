name: Lyra CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths:
      - "packages/**"
      - "package*.json"
      - "docs/**"
      - "*.md"
      - ".github/**"
  push:
    branches: [main, dev]
    paths:
      - "packages/**"
      - "package*.json"
      - "docs/**"
      - "*.md"
      - ".github/**"

concurrency:
  group: lyra-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  branch-guard:
    name: Branch Guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify target branch policy
        run: |
          BASE_REF="${{ github.base_ref }}"
          HEAD_REF="${{ github.head_ref }}"
          echo "PR Base branch: $BASE_REF"
          echo "PR Head branch: $HEAD_REF"
          if [ "$BASE_REF" = "main" ] && [ "$HEAD_REF" != "dev" ]; then
            echo "::error title=Target Branch Invalid::普通功能与修复 PR 的目标分支必须为 'dev'。只有发版 PR（dev -> main）才允许以 'main' 为目标分支。请在 PR 顶部点击 Edit 将 base branch 修改为 'dev'。"
            exit 1
          fi
          echo "分支合规检查通过。"

  backend:
    name: Backend tests
    needs: [branch-guard]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: |
            packages/shared/package-lock.json
            packages/agent/package-lock.json
            packages/main/package-lock.json
      - name: Install backend dependencies
        run: npm --prefix packages/shared ci && npm --prefix packages/agent ci && npm --prefix packages/main ci
      - name: Build shared and agent
        run: npm --prefix packages/shared run build && npm --prefix packages/agent run build
      - name: Run backend tests
        run: npm --prefix packages/main test

  frontend:
    name: Frontend tests and build
    needs: [branch-guard]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: |
            packages/shared/package-lock.json
            packages/web/package-lock.json
      - name: Install frontend dependencies
        run: npm --prefix packages/shared ci && npm --prefix packages/web ci
      - name: Build shared contract
        run: npm --prefix packages/shared run build
      - name: Run frontend tests
        run: npm --prefix packages/web test
      - name: Build frontend
        run: npm --prefix packages/web run build

  ai-review:
    name: Read-only AI Review
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
      - name: AI Code Review (Informational Only)
        continue-on-error: true
        env:
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_DEFAULT_MODEL: ${{ secrets.LLM_DEFAULT_MODEL }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 .github/scripts/pr_ai_review.py
