name: Lyra CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths:
      - "packages/**"
      - "package*.json"
      - "docs/**"
      - "*.md"
      - ".github/workflows/ci.yml"
  pull_request_review:
    types: [submitted, dismissed]
  push:
    branches: [main, dev]
    paths:
      - "packages/**"
      - "package*.json"
      - "docs/**"
      - "*.md"
      - ".github/workflows/ci.yml"

concurrency:
  group: lyra-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: |
            packages/shared/package-lock.json
            packages/agent/package-lock.json
            packages/main/package-lock.json
      - name: Install backend dependencies
        run: npm --prefix packages/shared ci && npm --prefix packages/agent ci && npm --prefix packages/main ci
      - name: Build shared and agent
        run: npm --prefix packages/shared run build && npm --prefix packages/agent run build
      - name: Run backend tests
        run: npm --prefix packages/main test

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: |
            packages/shared/package-lock.json
            packages/web/package-lock.json
      - name: Install frontend dependencies
        run: npm --prefix packages/shared ci && npm --prefix packages/web ci
      - name: Build shared contract
        run: npm --prefix packages/shared run build
      - name: Run frontend tests
        run: npm --prefix packages/web test
      - name: Build frontend
        run: npm --prefix packages/web run build

  retarget:
    name: Retarget PR to dev
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Point base branch to dev
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh api -X PATCH "repos/${{ github.repository }}/pulls/$PR_NUMBER" -f base=dev
          gh pr comment "$PR_NUMBER" --body "PR Autopilot：目标分支已从 main 自动切换到 dev。"

  autopilot:
    name: PR Safety Gate
    if: github.event.pull_request.draft == false && github.event.pull_request.base.ref == 'dev'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HUMAN_REVIEWERS: 255308153,VerCurL,jbgz-2001,Rennenghui,yeyy-ppp
    steps:
      - name: "Guard: conflicts and current human approval"
        id: guard
        run: |
          set -euo pipefail
          gh pr view "$PR_NUMBER" --json isDraft,mergeable,author,headRefOid > /tmp/pr.json
          gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER/reviews?per_page=100" > /tmp/reviews.json
          python3 - <<'PY' > /tmp/guard.txt
          import json
          import os

          pull = json.load(open('/tmp/pr.json'))
          reviews = json.load(open('/tmp/reviews.json'))
          reasons = []

          if pull.get('mergeable') != 'MERGEABLE':
              reasons.append('分支有冲突或合并状态未知：' + str(pull.get('mergeable')))

          allowed = {name.casefold() for name in os.environ['HUMAN_REVIEWERS'].split(',') if name}
          author = (pull.get('author') or {}).get('login', '').casefold()
          head = pull.get('headRefOid')
          latest = {}
          for review in reviews:
              login = ((review.get('user') or {}).get('login') or '').casefold()
              if login:
                  latest[login] = review
          approved = [login for login, review in latest.items()
                      if login in allowed and login != author
                      and review.get('state') == 'APPROVED'
                      and review.get('commit_id') == head]
          if not approved:
              reasons.append('当前 head 缺少默认审核人中的非作者 APPROVED review')

          print('READY' if not reasons else 'BLOCK: ' + '；'.join(sorted(set(reasons))[:6]))
          PY
          RESULT="$(cat /tmp/guard.txt)"
          echo "reason=$RESULT" >> "$GITHUB_OUTPUT"
          {
            echo "## PR Safety Gate"
            echo
            echo "$RESULT"
            echo
            echo "This workflow never merges or approves a pull request. The repository PR manager performs the final squash merge only after all gates pass."
          } >> "$GITHUB_STEP_SUMMARY"
