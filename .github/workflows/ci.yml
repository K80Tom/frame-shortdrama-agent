name: Lyra CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths:
      - "packages/**"
      - "package*.json"
      - "docs/**"
      - "history/**"
      - "deploy/**"
      - ".gitignore"
      - "*.md"
      - ".github/**"
  push:
    branches: [main, dev]
    paths:
      - "packages/**"
      - "package*.json"
      - "docs/**"
      - "history/**"
      - "deploy/**"
      - ".gitignore"
      - "*.md"
      - ".github/**"

concurrency:
  group: lyra-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  branch-guard:
    name: Branch Guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Enforce read-only GitHub Actions
        run: node deploy/check-workflows-readonly.mjs
      - name: Verify target branch policy
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "Push event: branch target validation is not required."
            exit 0
          fi
          echo "PR Base branch: $BASE_REF"
          echo "PR Head branch: $HEAD_REF"
          if [ "$BASE_REF" = "main" ] && [ "$HEAD_REF" != "dev" ]; then
            echo "::error title=Target Branch Invalid::普通功能与修复 PR 的目标分支必须为 'dev'。只有发版 PR（dev -> main）才允许以 'main' 为目标分支。请在 PR 顶部点击 Edit 将 base branch 修改为 'dev'。"
            exit 1
          fi
          echo "分支合规检查通过。"

  project-records:
    name: Project records
    needs: [branch-guard]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
      - name: Validate shared and personal record boundaries
        run: npm run docs:check
      - name: Check patch whitespace
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git diff --check "origin/${BASE_REF}...HEAD"
          else
            git diff --check HEAD^ HEAD
          fi

  backend:
    name: Backend tests
    needs: [branch-guard]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: |
            packages/shared/package-lock.json
            packages/agent/package-lock.json
            packages/main/package-lock.json
      - name: Install and build shared contract
        run: npm --prefix packages/shared ci && npm --prefix packages/shared run build
      - name: Install backend dependencies
        run: npm --prefix packages/agent ci --install-links && npm --prefix packages/main ci
      - name: Build agent
        run: npm --prefix packages/agent run build
      - name: Run agent tests
        run: npm --prefix packages/agent test
      - name: Run backend tests
        run: npm --prefix packages/main test

  database:
    name: Database e2e
    needs: [branch-guard]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:17-alpine
        env:
          POSTGRES_USER: shortdrama
          POSTGRES_PASSWORD: shortdrama123
          POSTGRES_DB: shortdrama_agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shortdrama -d shortdrama_agent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://shortdrama:shortdrama123@127.0.0.1:5432/shortdrama_agent
      DATABASE_ADMIN_URL: postgresql://shortdrama:shortdrama123@127.0.0.1:5432/shortdrama_agent
      DATABASE_APP_URL: postgresql://lyra_ci_app:stage1ciapp123@127.0.0.1:5432/shortdrama_agent
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: |
            packages/shared/package-lock.json
            packages/agent/package-lock.json
            packages/main/package-lock.json
      - name: Install and build shared contract
        run: npm --prefix packages/shared ci && npm --prefix packages/shared run build
      - name: Install backend dependencies
        run: npm --prefix packages/agent ci --install-links && npm --prefix packages/main ci
      - name: Build agent
        run: npm --prefix packages/agent run build
      - name: Reject unsafe application-role targets
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGDATABASE: shortdrama_agent
          PGUSER: shortdrama
          PGPASSWORD: shortdrama123
          POSTGRES_APP_USER: postgres
          POSTGRES_APP_PASSWORD: stage1ciapp123
        run: |
          if psql --file deploy/postgres-init-app-role.sql; then
            echo "::error::Role bootstrap accepted a reserved PostgreSQL role name."
            exit 1
          fi
          test "$(psql --tuples-only --no-align --command "SELECT rolsuper FROM pg_roles WHERE rolname = 'shortdrama'")" = "t"
      - name: Create non-privileged application role
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGDATABASE: shortdrama_agent
          PGUSER: shortdrama
          PGPASSWORD: shortdrama123
          POSTGRES_APP_USER: lyra_ci_app
          POSTGRES_APP_PASSWORD: stage1ciapp123
        run: psql --file deploy/postgres-init-app-role.sql
      - name: Apply database migrations
        run: npm --prefix packages/main run db:migrate
      - name: Verify Stage 1 migration baseline
        run: |
          applied="$(psql "$DATABASE_ADMIN_URL" --tuples-only --no-align --command \
            "SELECT string_agg(version, ',' ORDER BY version) FROM schema_migrations WHERE version IN ('030', '031')")"
          test "$applied" = "030,031" || {
            echo "::error::Stage 1 runtime requires migrations 030 and 031; found: ${applied:-none}"
            exit 1
          }
      - name: Run database integration and offline production matrix
        run: npm --prefix packages/main run test:db
      - name: Verify RLS with the non-privileged application role
        run: DATABASE_URL="$DATABASE_APP_URL" npm --prefix packages/main run test:rls

  frontend:
    name: Frontend tests and build
    needs: [branch-guard]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: |
            packages/shared/package-lock.json
            packages/web/package-lock.json
      - name: Install and build shared contract
        run: npm --prefix packages/shared ci && npm --prefix packages/shared run build
      - name: Install frontend dependencies
        run: npm --prefix packages/web ci --install-links
      - name: Run frontend tests
        run: npm --prefix packages/web test
      - name: Build frontend
        run: npm --prefix packages/web run build

  deployment:
    name: Stage 1 deployment config
    needs: [branch-guard]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      POSTGRES_PASSWORD: stage1postgres123
      POSTGRES_APP_USER: lyra_app
      POSTGRES_APP_PASSWORD: stage1app123
      REDIS_PASSWORD: stage1redis123
      MINIO_ROOT_USER: lyraroot
      MINIO_ROOT_PASSWORD: stage1minioroot123
      LYRA_OBJECT_ACCESS_KEY: lyraapp
      LYRA_OBJECT_SECRET_KEY: stage1object123
      LYRA_PUBLIC_ORIGIN: https://lyra.example.test
    steps:
      - uses: actions/checkout@v6
      - name: Validate Compose topology
        run: docker compose -f deploy/compose.yaml config --quiet
      - name: Verify database role separation
        run: |
          docker compose -f deploy/compose.yaml config --format json > /tmp/lyra-compose.json
          python3 - <<'PY'
          import json
          with open('/tmp/lyra-compose.json', encoding='utf-8') as source:
              services = json.load(source)['services']
          api_url = services['main-api']['environment']['DATABASE_URL']
          worker_url = services['main-worker']['environment']['DATABASE_URL']
          migrate_url = services['migrate']['environment']['DATABASE_URL']
          api_environment = services['main-api']['environment']
          worker_environment = services['main-worker']['environment']
          assert api_url == worker_url
          assert 'lyra_app:stage1app123@postgres:5432/' in api_url
          assert 'shortdrama:stage1postgres123@postgres:5432/' in migrate_url
          assert api_url != migrate_url
          assert 'POSTGRES_PASSWORD' not in api_environment
          assert 'POSTGRES_PASSWORD' not in worker_environment
          assert 'MINIO_ROOT_PASSWORD' not in api_environment
          assert 'MINIO_ROOT_PASSWORD' not in worker_environment
          assert all('stage1postgres123' not in str(value) for value in api_environment.values())
          assert all('stage1postgres123' not in str(value) for value in worker_environment.values())
          assert all('stage1minioroot123' not in str(value) for value in api_environment.values())
          assert all('stage1minioroot123' not in str(value) for value in worker_environment.values())
          assert 'postgres-app-role' in services['migrate']['depends_on']
          PY
      - name: Validate object-storage policy
        run: node -e "JSON.parse(require('node:fs').readFileSync('deploy/minio-media-policy.json','utf8'))"
      - name: Validate Web runtime background config
        run: |
          set -eu
          test_dir="$(mktemp -d)"
          trap 'rm -rf "$test_dir"' EXIT
          target="$test_dir/runtime-config.js"
          video='https://cdn.example.test/lyra/backdrop.mp4?version=1'
          poster='https://cdn.example.test/lyra/backdrop.webp'

          LYRA_RUNTIME_CONFIG_PATH="$target" \
            LYRA_BACKDROP_VIDEO_URL="$video" \
            LYRA_BACKDROP_POSTER_URL="$poster" \
            sh deploy/web-runtime-config.sh
          grep -Fq "backdropVideoUrl: '$video'" "$target"
          grep -Fq "backdropPosterUrl: '$poster'" "$target"

          if LYRA_RUNTIME_CONFIG_PATH="$target" \
            LYRA_BACKDROP_VIDEO_URL='https://cdn.example.test/bad"quote.mp4' \
            sh deploy/web-runtime-config.sh; then
            echo 'unsafe runtime URL was accepted' >&2
            exit 1
          fi
          grep -Fq "backdropVideoUrl: '$video'" "$target"

          LYRA_RUNTIME_CONFIG_PATH="$target" sh deploy/web-runtime-config.sh
          grep -Fq "backdropVideoUrl: ''" "$target"
          grep -Fq "backdropPosterUrl: ''" "$target"

  container-images:
    name: Container image (${{ matrix.image }})
    needs: [branch-guard]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: main
            dockerfile: deploy/Dockerfile.main
          - image: web
            dockerfile: deploy/Dockerfile.web
    steps:
      - uses: actions/checkout@v6
      - name: Build runtime image without pushing
        run: docker build --file "${{ matrix.dockerfile }}" --tag "lyra-ci-${{ matrix.image }}:${{ github.sha }}" .
