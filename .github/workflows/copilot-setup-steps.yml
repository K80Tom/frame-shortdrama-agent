name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: |
            shortdrama-agent-lab/package-lock.json
            shortdrama-agent-lab/web/package-lock.json

      - name: Install backend dependencies
        working-directory: shortdrama-agent-lab
        run: npm ci

      - name: Install frontend dependencies
        working-directory: shortdrama-agent-lab/web
        run: npm ci
