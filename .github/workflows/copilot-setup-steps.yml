name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

permissions:
  contents: read

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: |
            packages/shared/package-lock.json
            packages/agent/package-lock.json
            packages/main/package-lock.json
            packages/web/package-lock.json

      - name: Install and build shared contract
        run: npm --prefix packages/shared ci && npm --prefix packages/shared run build

      - name: Install backend dependencies
        run: npm --prefix packages/agent ci --install-links && npm --prefix packages/main ci

      - name: Build agent
        run: npm --prefix packages/agent run build

      - name: Install frontend dependencies
        run: npm --prefix packages/web ci --install-links
