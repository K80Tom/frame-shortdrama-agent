# 发布 Lyra Docker 一键包：构建 main / web 镜像推送到 GHCR，并在 GitHub Release 挂上部署包。
#
# 触发：
#   - 推送 v* 标签（如 v0.2.0）
#   - 或手动 workflow_dispatch 指定版本
#
# 说明：
#   - 仓库顶层 permissions 为只读，本工作流显式声明所需的最小写权限（packages / contents）。
#   - 镜像名必须全小写（GHCR 要求），这里由仓库名转换得到。
#   - 同时构建 linux/amd64 与 linux/arm64，覆盖 Intel/AMD 与 Apple Silicon 本地电脑。

name: Release Docker

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '发布版本（例如 v0.2.0）'
        required: true
        type: string

permissions:
  contents: write
  packages: write

env:
  BUNDLE_NAME: lyra-docker

jobs:
  validate:
    name: 校验发布来源与版本
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 校验版本与 main 提交
        id: version
        shell: bash
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="$DISPATCH_TAG"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "版本必须使用稳定标签格式 vX.Y.Z，实际为：$VERSION" >&2
            exit 1
          }
          MANIFEST_VERSION="v$(node -p 'require("./package.json").version')"
          [ "$VERSION" = "$MANIFEST_VERSION" ] || {
            echo "发布版本必须与根 package.json 一致：input=$VERSION manifest=$MANIFEST_VERSION" >&2
            exit 1
          }

          git fetch origin main --no-tags
          MAIN_SHA="$(git rev-parse origin/main)"
          [ "$GITHUB_SHA" = "$MAIN_SHA" ] || {
            echo "只允许从最新 main 发布：event=$GITHUB_SHA main=$MAIN_SHA" >&2
            exit 1
          }
          if git show-ref --verify --quiet "refs/tags/$VERSION"; then
            TAG_SHA="$(git rev-parse "$VERSION^{commit}")"
            [ "$TAG_SHA" = "$GITHUB_SHA" ] || {
              echo "已存在的 $VERSION 指向 $TAG_SHA，不能用 $GITHUB_SHA 覆盖同版本镜像" >&2
              exit 1
            }
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  images:
    name: 构建 ${{ matrix.suffix }} 镜像
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suffix: main
            file: deploy/Dockerfile.main
          - suffix: web
            file: deploy/Dockerfile.web
    steps:
      - uses: actions/checkout@v4

      - name: 计算小写镜像前缀
        id: image
        run: echo "prefix=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.prefix }}-${{ matrix.suffix }}
          tags: |
            type=raw,value=${{ needs.validate.outputs.version }}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: 生成一键包并创建 Release
    needs: [validate, images]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 打包部署文件
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          mkdir -p bundle/lyra-docker
          cp deploy/compose.yaml deploy/nginx.conf deploy/.env.example deploy/README.md deploy/minio-media-policy.json \
             deploy/postgres-init-app-role.sql \
             deploy/Dockerfile.main deploy/Dockerfile.web deploy/web-runtime-config.sh bundle/lyra-docker/
          sed -i "s/^LYRA_TAG=.*/LYRA_TAG=${VERSION}/" bundle/lyra-docker/.env.example
          grep -Fx "LYRA_TAG=${VERSION}" bundle/lyra-docker/.env.example
          tar -czf "${BUNDLE_NAME}-${VERSION}.tar.gz" -C bundle lyra-docker

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.version }}
          name: Lyra ${{ needs.validate.outputs.version }}
          files: ${{ env.BUNDLE_NAME }}-*.tar.gz
          draft: false
          body: |
            Lyra ${{ needs.validate.outputs.version }} Stage 1 集成基线部署包（Docker Compose，单受信 workspace 试运行）

            本版本主要更新：
            - 会话认证、workspace 选择和受信自托管 workspace 注册；不提供默认账号或明文密码。
            - `main-api` / `main-worker` 分进程运行，PostgreSQL 使用迁移管理员与非特权应用账号分离。
            - Redis 对话快照与分布式限流、Milvus v2 租户向量投影，以及 MinIO/S3/OSS/COS 统一对象存储端口。
            - Web 同源反向代理、运行时背景素材配置，以及 API、Worker、PostgreSQL、Redis、Milvus 和对象存储状态展示。

            需要 Docker Desktop 或 Docker Engine 24+（含 compose 插件）。

            快速开始：
            ```sh
            tar -xzf ${{ env.BUNDLE_NAME }}-${{ needs.validate.outputs.version }}.tar.gz
            cd lyra-docker              # 解压后目录
            cp .env.example .env        # 分别填写 PostgreSQL 管理/应用、Redis、MinIO 密码
            docker compose up -d
            ```

            按包内 `README.md` 通过 `node dist/auth/bootstrap-admin.js` 执行一次性管理员 bootstrap，再用浏览器打开
            http://localhost:8788（必须与 `.env` 中的 `LYRA_PUBLIC_ORIGIN` 完全一致；正式环境使用 HTTPS）登录。

            - 镜像：`ghcr.io/k80tom/frame-shortdrama-agent-main:${{ needs.validate.outputs.version }}`、`-web` 同版本（同时提供 linux/amd64 与 linux/arm64）。
            - 当前 Stage 1 最低 schema 基线为迁移 `031`；`030` 完成租户表 `NOT NULL + FORCE RLS` contract，API/Worker 不会以过旧 schema 启动。
            - PostgreSQL、Redis、MinIO、Milvus 与应用私有数据使用独立卷；`docker compose down` 不会删除数据。
            - 本包不包含任何密钥；所有模型凭据由使用者自行填写。
            - 导入资产图片仍保存于 PostgreSQL；依赖探针通过不代表媒体对象投影、Milvus 回填、签名公网 endpoint、备份恢复或公网多租户安全验收已经完成。上线边界以包内 `README.md` 为准。
