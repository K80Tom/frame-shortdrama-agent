server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 剧本、素材上传等请求体上限；按需调整。
    client_max_body_size 64m;

    # AI 工作区流式回复走 SSE，必须关闭缓冲并放宽读超时。
    location /api/ {
        proxy_pass http://main-api:8788;
        proxy_http_version 1.1;
        # 保留浏览器原始 host:port，便于 main 校验同源请求。
        proxy_set_header Host $http_host;
        # This is the only public Compose edge, so never append a client-supplied
        # forwarding chain.  When a trusted LB/WAF is placed in front, configure
        # Nginx real_ip trust for its exact CIDRs so $remote_addr is still the
        # verified client address before forwarding it to the API.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /livez {
        access_log off;
        proxy_pass http://main-api:8788/livez;
        proxy_set_header Host $http_host;
    }

    location = /readyz {
        access_log off;
        proxy_pass http://main-api:8788/readyz;
        proxy_set_header Host $http_host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location = /runtime-config.js {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
}
